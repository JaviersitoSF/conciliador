name: Construir ejecutable de Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements-build.txt

      - name: Ejecutar pruebas
        run: python -m pytest

      - name: Construir ejecutable de terminal
        run: python -m PyInstaller --clean --noconfirm Conciliador-Terminal.spec

      - name: Construir ejecutable con interfaz
        run: python -m PyInstaller --clean --noconfirm Conciliador-UI.spec

      - name: Publicar ejecutables
        uses: actions/upload-artifact@v4
        with:
          name: Conciliador-Windows
          path: |
            dist/Conciliador-Terminal.exe
            dist/Conciliador-UI.exe
          if-no-files-found: error
